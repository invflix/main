
services:
  postgres:
    image: postgres:16-alpine
    container_name: medistock-postgres
    environment:
      POSTGRES_DB: medistock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medistock"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: medistock-valkey
    command: valkey-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: medistock-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/workspace
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/medistock
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/1
      - CACHE_URL=redis://valkey:6379/2
      - JWT_SECRET=supersecretjwtkeyforlocaldevelopmentonly123!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: medistock-celery-worker
    command: celery -A app.celery.app.celery_app worker --loglevel=info
    volumes:
      - ./apps/api:/workspace
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/medistock
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/1
      - CACHE_URL=redis://valkey:6379/2
      - JWT_SECRET=supersecretjwtkeyforlocaldevelopmentonly123!
      - JWT_ALGORITHM=HS256
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: medistock-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace
      - /workspace/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  valkeydata:
